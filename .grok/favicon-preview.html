<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#111;color:#eee;font:14px/1.4 sans-serif}
  .row{display:flex;gap:24px;align-items:flex-end;padding:24px}
  .cell{text-align:center}
  img.i16{width:16px;height:16px;image-rendering:auto}
  img.i32{width:32px;height:32px}
  img.i64{width:64px;height:64px}
  img.i128{width:128px;height:128px}
  .frame{background:#fff;padding:8px;display:inline-block}
  .frame.dark{background:#0c1a32}
</style>
<div class="row">
  <div class="cell"><div class="frame"><img class="i16" src="file:///workspace/public/favicon.svg"></div><div>16</div></div>
  <div class="cell"><div class="frame"><img class="i32" src="file:///workspace/public/favicon.svg"></div><div>32</div></div>
  <div class="cell"><div class="frame dark"><img class="i64" src="file:///workspace/public/favicon.svg"></div><div>64 on navy</div></div>
  <div class="cell"><div class="frame"><img class="i128" src="file:///workspace/public/favicon.svg"></div><div>128</div></div>
</div>
